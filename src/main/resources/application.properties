spring.application.name=jisr-nihongo-platform

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jisr_nihongo_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

# Error Handling Configuration
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# Openrouter Configuration
openrouter.api.key=OPENROUTER_API_KEY
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# Gmail SMTP Configuration (MAIL_PASSWORD is a 16-character Google App Password, not the account password)
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Notifications
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${spring.mail.username}}

# Email template caching
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
